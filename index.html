<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Trick or Treat 🎃</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container container-principal">
        <h1>Virtual Trick or Treat</h1>
        <p>A coragem tem um preço... vais escolher uma Doçura ou uma Travessura?</p>

        <div class="botoes">
            <a href="https://www.paypal.me/BeaMatos2001" target="_blank" class="btn-docura">🍬 Doçura!</a>
            <button class="btn-travessura" onclick="escolherTravessuraAleatoria()">🕷️ Travessura!</button>
        </div>

        <div id="resultado-sustinho"></div>
    </div>

    <footer>
        Criado para a noite mais assustadora do ano 🎃
    </footer>

    <script>
        function escolherTravessuraAleatoria() {
            const numero = Math.floor(Math.random() * 3) + 1;
            
            window.location.href = `travessura${numero}.html`;
        }
    </script>

</body>
</html>
