<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasão Fantasma 👻 - Virtual Trick or Treat</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" style="margin-top: 15vh;">
        <h1 style="color: #ff9900;">Invasão de Espíritos!</h1>
        <p>O site foi tomado por fantasmas esfomeados por doces...</p>

        <div class="botoes row justify-content-center text-center g-5 mb-5">
             <div class="col-12 col-md-auto d-flex flex-column align-items-center mb-4 mb-sm-0">
                 <a href="https://www.paypal.me/BeaMatos2001" target="_blank" class="btn-docura">🍬 Subornar com Doçura</a>
             </div>
             <div class="col-12 col-md-auto d-flex flex-column align-items-center mb-4 mb-sm-0">
                 <a href="index.html" class="btn-travessura" style="text-decoration: none; display: inline-block;">Tentar a sorte de novo</a>
             </div>
        </div>
    </div>

    <script>
        for (let i = 0; i < 20; i++) {
            let fantasma = document.createElement('div');
            fantasma.innerHTML = '👻';
            fantasma.classList.add('fantasma');
            fantasma.style.top = Math.random() * window.innerHeight + 'px';
            fantasma.style.left = Math.random() * window.innerWidth + 'px';
            fantasma.style.animationDuration = (Math.random() * 2 + 2) + 's';
            fantasma.style.animationDelay = (Math.random() * 0.5) + 's';
            document.body.appendChild(fantasma);
        }
    </script>

</body>
</html>
