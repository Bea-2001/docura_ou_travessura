<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Escuridão 🕯️ - Virtual Trick or Treat</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="modo-escuro">

    <!-- Ecrã de escuridão total com a máscara de luz da vela -->
    <div id="ecra-vela"></div>
    
    <!-- Conteúdo revelado apenas pela luz -->
    <div id="conteudo-escuro" style="display: flex;">
        <h2 style="font-family: 'Creepster', cursive; color: #ff3333; font-size: 2.5rem;">A luz apagou-se...</h2>
        <p>Procura bem nas sombras. Consegues encontrar a doçura escondida?</p>
        
        <!-- Substitui pelo teu link do PayPal -->
        <a href="https://paypal.me/O_TEU_NICKNAME" target="_blank" class="btn-docura-escondida">🍬 Encontraste a Doçura!</a>
        
        <br><br>
        <a href="index.html" style="background: #444; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-family: 'Special Elite', monospace;">Voltar ao início</a>
    </div>

    <!-- O rato em forma de vela -->
    <div id="cursor-vela">🕯️</div>

    <script>
        const cursorVela = document.getElementById('cursor-vela');
        
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX + 'px';
            const y = e.clientY + 'px';
            
            document.documentElement.style.setProperty('--x', x);
            document.documentElement.style.setProperty('--y', y);
            
            cursorVela.style.left = x;
            cursorVela.style.top = y;
        });
    </script>

</body>
</html>
